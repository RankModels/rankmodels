<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RankModels Interactive Arena</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  :root{
    --bg:#0b0f16;--bg2:#12181f;--bg3:#161d26;--bg4:#1c2531;
    --bd:#2a3441;--bd2:#3a4756;
    --tx:#d7dee7;--mut:#8b949e;--dim:#6e7a89;
    --acc:#58a6ff;--acc2:#bc8cff;--ok:#3fb950;--warn:#d29922;--err:#f85149;
    --r:12px;--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6;
    background-image:radial-gradient(900px 500px at 10% -10%,rgba(88,166,255,.10),transparent 60%),radial-gradient(800px 500px at 100% 0%,rgba(188,140,255,.08),transparent 55%);
    background-attachment:fixed;
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2c3644;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#3d4a5c;background-clip:padding-box}

  header.topbar{
    position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 22px;background:rgba(11,15,22,.82);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--bd);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 14px rgba(88,166,255,.7)}
  .brand small{font-weight:500;color:var(--dim);font-size:12px;border:1px solid var(--bd);padding:2px 7px;border-radius:20px}
  .spacer{flex:1}
  .seg{display:flex;background:var(--bg2);border:1px solid var(--bd);border-radius:9px;padding:3px;gap:2px}
  .seg button{
    background:transparent;border:0;color:var(--mut);font:inherit;font-size:12.5px;font-weight:600;
    padding:5px 11px;border-radius:6px;cursor:pointer;transition:.15s;
  }
  .seg button:hover{color:var(--tx)}
  .seg button.on{background:var(--bg4);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
  .btn{
    display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--bd);
    color:var(--tx);font:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;transition:.15s;
  }
  .btn:hover{background:var(--bg4);border-color:var(--bd2)}
  .btn:active{transform:translateY(1px)}
  .btn.accent{border-color:rgba(88,166,255,.45);color:#cfe4ff}
  .btn.ghost{background:transparent}
  .btn.ok{color:var(--ok);border-color:rgba(63,185,80,.5)}

  main{padding:22px}

  .prompt-box{
    background:linear-gradient(180deg,var(--bg2),rgba(18,24,31,.6));
    border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px;margin-bottom:20px;
  }
  .prompt-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .prompt-head h2{margin:0;font-size:20px;letter-spacing:-.2px}
  .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:12.5px;margin-bottom:12px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.3px;
    padding:3px 9px;border-radius:20px;border:1px solid var(--bd);background:var(--bg3);color:var(--mut);text-transform:uppercase;
  }
  .chip.easy{color:#7ee2a8;border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.08)}
  .chip.medium{color:#e8c46a;border-color:rgba(210,153,34,.4);background:rgba(210,153,34,.08)}
  .chip.hard,.chip.expert{color:#ff9c94;border-color:rgba(248,81,73,.4);background:rgba(248,81,73,.08)}
  .chip.count{text-transform:none;color:var(--acc);border-color:rgba(88,166,255,.35);background:rgba(88,166,255,.08)}
  blockquote.prompt-text{
    margin:0;border-left:3px solid var(--acc);background:rgba(88,166,255,.05);
    padding:10px 14px;border-radius:0 8px 8px 0;color:#aeb9c6;white-space:pre-wrap;
  }

  .arena{display:grid;gap:18px;align-items:start}
  .arena.cols{grid-auto-flow:column;grid-auto-columns:minmax(400px,1fr);overflow-x:auto;padding-bottom:14px}
  .arena.grid{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
  .arena.stack{grid-template-columns:1fr;max-width:1100px;margin:0 auto}

  .card{
    display:flex;flex-direction:column;min-width:0;background:var(--bg2);
    border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
  }
  .card-head{
    display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg3);
    border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;
  }
  .avatar{
    width:28px;height:28px;flex:0 0 28px;border-radius:8px;display:grid;place-items:center;
    font-size:12px;font-weight:800;color:#0b0f16;background:linear-gradient(135deg,#58a6ff,#bc8cff);
  }
  .card-title{min-width:0;flex:1}
  .card-title .name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-title .path{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:0 0 8px}
  .status.ok{background:var(--ok);box-shadow:0 0 8px rgba(63,185,80,.6)}
  .status.err{background:var(--err);box-shadow:0 0 8px rgba(248,81,73,.6)}
  .status.load{animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

  .card-body{padding:6px 16px 14px;overflow:auto;max-height:78vh;scroll-behavior:smooth}
  .card.tall .card-body{max-height:none}
  .card-foot{
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--bd);
    background:var(--bg3);color:var(--dim);font-size:11.5px;font-family:var(--mono)
  }

  .md h1,.md h2,.md h3,.md h4{line-height:1.3;margin:18px 0 8px;letter-spacing:-.2px}
  .md h1{font-size:21px}.md h2{font-size:18px}.md h3{font-size:16px}.md h4{font-size:14.5px}
  .md p{margin:10px 0}
  .md ul,.md ol{margin:10px 0;padding-left:22px}
  .md li{margin:4px 0}
  .md a{color:var(--acc);text-decoration:none}
  .md a:hover{text-decoration:underline}
  .md blockquote{margin:12px 0;padding:6px 14px;border-left:3px solid var(--bd2);color:var(--mut);background:rgba(255,255,255,.02)}
  .md hr{border:0;border-top:1px solid var(--bd);margin:18px 0}
  .md img{max-width:100%;border-radius:8px}
  .md table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px;display:block;overflow-x:auto}
  .md th,.md td{border:1px solid var(--bd);padding:7px 10px;text-align:left}
  .md th{background:var(--bg3)}
  .md :not(pre)>code{
    font-family:var(--mono);font-size:12.5px;background:rgba(110,118,129,.18);
    padding:2px 6px;border-radius:5px;color:#e7c9ff;
  }
  .placeholder{color:var(--dim);font-style:italic;padding:16px 0}
  .skeleton{height:12px;border-radius:6px;background:linear-gradient(90deg,#1b2husk,#1b2230,#232c3a,#1b2230);background-size:300% 100%;animation:sh 1.4s infinite;margin:10px 0}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .errbox{border:1px solid rgba(248,81,73,.35);background:rgba(248,81,73,.07);color:#ffb3ad;padding:12px 14px;border-radius:9px;font-size:13.5px}

  .cb{border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin:14px 0;background:#0c1117}
  .cb-bar{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:var(--bg4);border-bottom:1px solid var(--bd)}
  .cb-lang{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.6px}
  .cb-tabs{display:flex;gap:2px;background:rgba(0,0,0,.3);border-radius:7px;padding:2px;margin-left:4px}
  .cb-tabs button{background:transparent;border:0;color:var(--mut);font:inherit;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:5px;cursor:pointer}
  .cb-tabs button.on{background:var(--bg2);color:#fff}
  .cb-actions{margin-left:auto;display:flex;gap:4px}
  .ibtn{
    background:transparent;border:1px solid transparent;color:var(--mut);cursor:pointer;
    font:inherit;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:6px;transition:.15s;display:inline-flex;align-items:center;gap:5px;
  }
  .ibtn:hover{background:rgba(255,255,255,.06);color:var(--tx);border-color:var(--bd)}
  .ibtn.done{color:var(--ok)}
  .cb pre{margin:0;padding:14px;overflow:auto;max-height:460px;font-family:var(--mono);font-size:12.7px;line-height:1.6}
  .cb pre.wrap code{white-space:pre-wrap;word-break:break-word}
  .cb pre code{font-family:inherit;background:none;padding:0}
  .cb-pane{display:none}
  .cb-pane.on{display:block}
  .frame-wrap{position:relative;background:#fff}
  .frame-wrap iframe{display:block;width:100%;height:440px;border:0;background:#fff}
  .grip{height:12px;background:var(--bg4);cursor:ns-resize;display:grid;place-items:center;border-top:1px solid var(--bd)}
  .grip::after{content:"";width:44px;height:3px;border-radius:3px;background:var(--bd2)}

  .modal{position:fixed;inset:0;z-index:100;display:none;background:rgba(3,6,10,.85);backdrop-filter:blur(6px);padding:22px}
  .modal.on{display:flex;flex-direction:column;gap:12px}
  .modal-bar{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
  .modal iframe{flex:1;width:100%;border:0;border-radius:var(--r);background:#fff}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translate(-50%,26px);opacity:0;pointer-events:none;
    background:var(--bg4);border:1px solid var(--bd2);color:var(--tx);padding:9px 16px;border-radius:24px;
    font-size:13px;font-weight:600;z-index:200;transition:.22s;box-shadow:0 10px 30px rgba(0,0,0,.5)
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  @media(max-width:720px){
    main{padding:14px}
    .arena.cols{grid-auto-columns:minmax(88vw,1fr)}
    .arena.grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>RankModels Live Arena <small id="run-label">—</small></div>
  <div class="spacer"></div>
  <div class="seg" id="layout-seg">
    <button data-layout="cols">Columns</button>
    <button data-layout="grid">Grid</button>
    <button data-layout="stack">Stacked</button>
  </div>
  <button class="btn ghost" id="toggle-tall">Unlock height</button>
  <button class="btn accent" id="reload">Reload</button>
</header>

<main>
  <div class="prompt-box" id="prompt-container">Loading prompt info…</div>
  <div class="arena cols" id="arena-container"></div>
</main>

<div class="modal" id="modal">
  <div class="modal-bar">
    <strong id="modal-title">Preview</strong>
    <div class="spacer"></div>
    <button class="btn" id="modal-copy">Copy code</button>
    <button class="btn" id="modal-close">Close ✕</button>
  </div>
  <iframe id="modal-frame" sandbox="allow-scripts allow-modals allow-popups allow-forms allow-pointer-lock"></iframe>
</div>

<div class="toast" id="toast"></div>

<script>
const MODEL_PATHS = {
  "claude-opus-5":"claude/claude-opus-5",
  "claude-opus-4.8":"claude/claude-opus-4.8",
  "gpt-5.6-sol":"openai/gpt-5.6-sol",
  "gemini-3.7-flash":"gemini/gemini-3.7-flash",
  "grok-4.6":"grok/grok-4.6"
};
const DEFAULT_RUN = "./prompts/2026-08/17/01";
const RAW = new WeakMap();
const FRAMES = new Map();
let currentRun = DEFAULT_RUN;
let modalCode = "";

const $ = s => document.querySelector(s);
const toastEl = $("#toast");
let toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove("on"),1700);
}

if (window.marked) marked.setOptions({gfm:true,breaks:false,headerIds:false,mangle:false});

const io = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(!e.isIntersecting) return;
    const code = FRAMES.get(e.target);
    if(code!=null){ e.target.srcdoc = code; FRAMES.delete(e.target); }
    io.unobserve(e.target);
  });
},{rootMargin:"300px"});

function sanitize(html){
  return window.DOMPurify ? DOMPurify.sanitize(html,{USE_PROFILES:{html:true}}) : html;
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function bytes(n){
  if(n<1024) return n+" B";
  if(n<1048576) return (n/1024).toFixed(1)+" KB";
  return (n/1048576).toFixed(2)+" MB";
}
function initials(id){
  const p = id.replace(/[^a-z0-9.]/gi," ").trim().split(/\s+/);
  return (p[0]||"?").slice(0,2).toUpperCase();
}
function hueFor(id){
  let h=0;
  for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))%360;
  return h;
}
async function copyText(text,btn){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");}catch(_){}
    ta.remove();
  }
  if(btn){
    const old=btn.textContent;
    btn.textContent="Copied ✓";btn.classList.add("done");
    setTimeout(()=>{btn.textContent=old;btn.classList.remove("done");},1400);
  }
  toast("Copied to clipboard");
}
function makeDoc(code,kind){
  if(kind==="svg"){
    return "<!DOCTYPE html><html><head><meta charset='utf-8'><style>html,body{margin:0;height:100%;display:grid;place-items:center;background:#fff}svg{max-width:96%;max-height:96%}</style></head><body>"+code+"</body></html>";
  }
  if(/<html[\s>]/i.test(code)||/<!doctype/i.test(code)) return code;
  return "<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'></head><body>"+code+"</body></html>";
}
function previewKind(lang,code){
  const l=(lang||"").toLowerCase();
  if(["html","htm","xhtml","html5"].includes(l)) return "html";
  if(l==="svg") return "svg";
  const head=code.trim().slice(0,500).toLowerCase();
  if(!l||l==="markup"||l==="xml"||l==="text"){
    if(head.startsWith("<svg")) return "svg";
    if(head.includes("<!doctype html")||head.includes("<html")) return "html";
  }
  return null;
}
function openModal(code,kind,title){
  modalCode=code;
  $("#modal-title").textContent=title||"Preview";
  $("#modal-frame").srcdoc=makeDoc(code,kind);
  $("#modal").classList.add("on");
}
function closeModal(){
  $("#modal").classList.remove("on");
  $("#modal-frame").srcdoc="";
  modalCode="";
}
$("#modal-close").addEventListener("click",closeModal);
$("#modal-copy").addEventListener("click",e=>copyText(modalCode,e.currentTarget));
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

function iconBtn(label,title,fn){
  const b=document.createElement("button");
  b.className="ibtn";b.type="button";b.textContent=label;b.title=title||label;
  b.addEventListener("click",()=>fn(b));
  return b;
}

function enhanceCodeBlocks(root,modelId){
  const blocks=[...root.querySelectorAll("pre > code")];
  blocks.forEach((codeEl,i)=>{
    const pre=codeEl.parentElement;
    const raw=codeEl.textContent;
    const langClass=[...codeEl.classList].find(c=>c.indexOf("language-")===0);
    const lang=langClass?langClass.slice(9):"";
    if(window.hljs){ try{ hljs.highlightElement(codeEl); }catch(err){} }

    const kind=previewKind(lang,raw);
    const wrap=document.createElement("div");
    wrap.className="cb";
    pre.parentNode.insertBefore(wrap,pre);

    const bar=document.createElement("div");
    bar.className="cb-bar";
    const tag=document.createElement("span");
    tag.className="cb-lang";
    tag.textContent=lang||(kind?kind:"code");
    bar.appendChild(tag);

    const codePane=document.createElement("div");
    codePane.className="cb-pane";
    codePane.appendChild(pre);

    let previewPane=null,frame=null;
    if(kind){
      previewPane=document.createElement("div");
      previewPane.className="cb-pane";
      const fw=document.createElement("div");
      fw.className="frame-wrap";
      frame=document.createElement("iframe");
      frame.setAttribute("sandbox","allow-scripts allow-modals allow-popups allow-forms allow-pointer-lock");
      frame.setAttribute("loading","lazy");
      frame.title=modelId+" preview "+(i+1);
      fw.appendChild(frame);
      const grip=document.createElement("div");
      grip.className="grip";
      grip.addEventListener("pointerdown",ev=>{
        ev.preventDefault();
        const y0=ev.clientY,h0=frame.clientHeight;
        const move=m=>{ frame.style.height=Math.max(180,h0+(m.clientY-y0))+"px"; };
        const up=()=>{document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);};
        document.addEventListener("pointermove",move);
        document.addEventListener("pointerup",up);
      });
      previewPane.appendChild(fw);
      previewPane.appendChild(grip);

      const tabs=document.createElement("div");
      tabs.className="cb-tabs";
      const tPrev=document.createElement("button");tPrev.type="button";tPrev.textContent="Preview";
      const tCode=document.createElement("button");tCode.type="button";tCode.textContent="Code";
      const select=which=>{
        const p=which==="preview";
        tPrev.classList.toggle("on",p);
        tCode.classList.toggle("on",!p);
        previewPane.classList.toggle("on",p);
        codePane.classList.toggle("on",!p);
      };
      tPrev.addEventListener("click",()=>select("preview"));
      tCode.addEventListener("click",()=>select("code"));
      tabs.appendChild(tPrev);tabs.appendChild(tCode);
      bar.appendChild(tabs);
      select("preview");
      FRAMES.set(frame,makeDoc(raw,kind));
      io.observe(frame);
    }else{
      codePane.classList.add("on");
    }

    const actions=document.createElement("div");
    actions.className="cb-actions";
    if(kind){
      actions.appendChild(iconBtn("↻","Re-run preview",()=>{
        if(frame){ frame.srcdoc=""; frame.srcdoc=makeDoc(raw,kind); toast("Preview reloaded"); }
      }));
      actions.appendChild(iconBtn("⛶","Fullscreen preview",()=>openModal(raw,kind,modelId+" · "+(lang||kind))));
      actions.appendChild(iconBtn("↗","Open in new tab",()=>{
        const url=URL.createObjectURL(new Blob([makeDoc(raw,kind)],{type:"text/html"}));
        window.open(url,"_blank","noopener");
        setTimeout(()=>URL.revokeObjectURL(url),30000);
      }));
      actions.appendChild(iconBtn("⭳","Download file",()=>{
        const ext=kind==="svg"?"svg":"html";
        const type=kind==="svg"?"image/svg+xml":"text/html";
        const a=document.createElement("a");
        a.href=URL.createObjectURL(new Blob([raw],{type}));
        a.download=modelId.replace(/[^\w.-]/g,"_")+"-"+(i+1)+"."+ext;
        a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href),15000);
      }));
    }
    actions.appendChild(iconBtn("⇌","Toggle word wrap",()=>pre.classList.toggle("wrap")));
    actions.appendChild(iconBtn("Copy","Copy code",b=>copyText(raw,b)));
    bar.appendChild(actions);

    wrap.appendChild(bar);
    if(previewPane) wrap.appendChild(previewPane);
    wrap.appendChild(codePane);
  });
  return blocks.length;
}

function createCard(modelId,subPath){
  const card=document.createElement("div");
  card.className="card";
  card.id="card-"+modelId.replace(/[^\w-]/g,"_");
  const h=hueFor(modelId);
  card.innerHTML =
    '<div class="card-head">'+
      '<div class="avatar" style="background:linear-gradient(135deg,hsl('+h+',80%,68%),hsl('+((h+60)%360)+',80%,62%))">'+esc(initials(modelId))+'</div>'+
      '<div class="card-title"><div class="name">'+esc(modelId)+'</div><div class="path">'+esc(subPath)+'/response.md</div></div>'+
      '<span class="status load" title="loading"></span>'+
      '<button class="ibtn" data-act="copy-all" title="Copy full markdown">Copy MD</button>'+
    '</div>'+
    '<div class="card-body md"><div class="skeleton" style="width:70%"></div><div class="skeleton" style="width:95%"></div><div class="skeleton" style="width:88%"></div><div class="skeleton" style="width:40%"></div></div>'+
    '<div class="card-foot"><span data-slot="stats">fetching…</span></div>';
  card.querySelector('[data-act="copy-all"]').addEventListener("click",e=>{
    const md=RAW.get(card);
    if(md) copyText(md,e.currentTarget); else toast("Nothing to copy yet");
  });
  return card;
}

async function loadModelOutput(filePath,card,modelId){
  const body=card.querySelector(".card-body");
  const dot=card.querySelector(".status");
  const stats=card.querySelector('[data-slot="stats"]');
  const t0=performance.now();
  try{
    const res=await fetch(filePath,{cache:"no-store"});
    if(!res.ok) throw new Error(res.status+" "+res.statusText);
    const md=await res.text();
    if(!md.trim()) throw new Error("empty response file");
    RAW.set(card,md);
    body.innerHTML=sanitize(marked.parse(md));
    const n=enhanceCodeBlocks(body,modelId);
    dot.className="status ok";dot.title="loaded";
    const ms=Math.round(performance.now()-t0);
    stats.textContent=bytes(new Blob([md]).size)+" · "+md.split(/\s+/).filter(Boolean).length+" words · "+n+" code block"+(n===1?"":"s")+" · "+ms+" ms";
  }catch(err){
    dot.className="status err";dot.title="failed";
    body.innerHTML='<div class="errbox"><strong>Output pending or unavailable.</strong><br>'+esc(filePath)+'<br><small>'+esc(err.message)+'</small></div>';
    const retry=document.createElement("button");
    retry.className="btn ghost";retry.style.marginTop="10px";retry.textContent="Retry";
    retry.addEventListener("click",()=>{
      body.innerHTML='<div class="placeholder">Retrying…</div>';
      dot.className="status load";
      loadModelOutput(filePath,card,modelId);
    });
    body.appendChild(retry);
    stats.textContent="unavailable";
  }
}

function renderPrompt(data,runPath){
  const diff=(data.difficulty||"unrated").toString();
  const models=Array.isArray(data.models_tested)?data.models_tested:[];
  const box=$("#prompt-container");
  box.innerHTML =
    '<div class="prompt-head"><h2>'+esc(data.title||"Untitled prompt")+'</h2>'+
    '<span class="chip '+esc(diff.toLowerCase())+'">'+esc(diff)+'</span>'+
    '<span class="chip count">'+models.length+' models</span></div>'+
    '<div class="meta"><span>Submitted by <strong style="color:var(--tx)">'+esc(data.submitted_by||"anonymous")+'</strong></span>'+
    '<span>·</span><span style="font-family:var(--mono)">'+esc(runPath)+'</span></div>'+
    '<blockquote class="prompt-text">'+esc(data.prompt||"")+'</blockquote>'+
    '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn" id="copy-prompt">Copy prompt</button>'+
    '<button class="btn ghost" id="collapse-all">Collapse all previews</button></div>';
  $("#copy-prompt").addEventListener("click",e=>copyText(data.prompt||"",e.currentTarget));
  $("#collapse-all").addEventListener("click",()=>{
    document.querySelectorAll(".cb-tabs button:last-child").forEach(b=>b.click());
    toast("Switched every block to code view");
  });
}

async function initArena(runPath){
  currentRun=runPath;
  $("#run-label").textContent=runPath.replace(/^\.\//,"");
  const arena=$("#arena-container");
  arena.innerHTML="";
  FRAMES.clear();
  let promptData;
  try{
    const res=await fetch(runPath+"/prompt.json",{cache:"no-store"});
    if(!res.ok) throw new Error(res.status+" "+res.statusText);
    promptData=await res.json();
  }catch(err){
    $("#prompt-container").innerHTML=
      '<div class="errbox"><strong>Could not load '+esc(runPath)+'/prompt.json</strong><br><small>'+esc(err.message)+
      ' — if you opened this file directly, serve the folder over HTTP (e.g. <code>python3 -m http.server</code>).</small></div>';
    return;
  }
  renderPrompt(promptData,runPath);
  const models=Array.isArray(promptData.models_tested)?promptData.models_tested:[];
  if(!models.length){
    arena.innerHTML='<div class="placeholder">No models listed in models_tested.</div>';
    return;
  }
  models.forEach(modelId=>{
    const subPath=(promptData.model_paths&&promptData.model_paths[modelId])||MODEL_PATHS[modelId]||modelId;
    const card=createCard(modelId,subPath);
    arena.appendChild(card);
    loadModelOutput(runPath+"/"+subPath+"/response.md",card,modelId);
  });
}

const layoutSeg=$("#layout-seg");
function setLayout(mode){
  $("#arena-container").className="arena "+mode;
  [...layoutSeg.children].forEach(b=>b.classList.toggle("on",b.dataset.layout===mode));
  try{localStorage.setItem("rm-layout",mode);}catch(e){}
}
layoutSeg.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(b) setLayout(b.dataset.layout);
});
$("#toggle-tall").addEventListener("click",e=>{
  const on=!document.querySelector(".card.tall");
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("tall",on));
  e.currentTarget.textContent=on?"Lock height":"Unlock height";
});
$("#reload").addEventListener("click",()=>initArena(currentRun));

let saved="cols";
try{saved=localStorage.getItem("rm-layout")||"cols";}catch(e){}
setLayout(saved);

const runParam=new URLSearchParams(location.search).get("run");
initArena(runParam||DEFAULT_RUN);
</script>
