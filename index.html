<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starfall Arena · RankModels</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  :root{
    --void:#050a17;--deep:#081026;--night:#0b1630;--slate:#101d3d;--raise:#16264c;
    --line:rgba(150,185,255,.14);--line2:rgba(150,185,255,.26);
    --ink:#dce8fb;--soft:#9fb3d4;--mute:#6d81a5;
    --star:#ffffff;--beam:#8ab6ff;--halo:#a9a2ff;--blush:#ffb3d2;--mint:#7fe3c0;--amber:#ffd479;--ember:#ff8f87;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --rail:296px;--frame-h:400px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    font-size:15px;line-height:1.62;color:var(--ink);background:var(--void);overflow:hidden;
  }
  #sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    background:
      radial-gradient(1200px 800px at 8% -12%,rgba(60,110,220,.30),transparent 62%),
      radial-gradient(900px 700px at 96% 4%,rgba(120,95,235,.20),transparent 58%),
      radial-gradient(1000px 900px at 50% 118%,rgba(30,70,160,.28),transparent 60%),
      linear-gradient(180deg,#060d20,#040812 70%);
  }
  #sky .glim{position:absolute;fill:#fff;opacity:.14;animation:twinkle 6s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.06;transform:scale(.86) rotate(0deg)}50%{opacity:.30;transform:scale(1.06) rotate(12deg)}}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(140,175,255,.20);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(140,175,255,.38);background-clip:padding-box}
  ::selection{background:rgba(138,182,255,.30)}

  .app{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail) 1fr;height:100vh}
  .rail{
    display:flex;flex-direction:column;gap:16px;padding:16px 14px;overflow-y:auto;
    border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(8,16,38,.92),rgba(5,10,23,.86));backdrop-filter:blur(20px);
  }
  .col{display:flex;flex-direction:column;min-width:0;height:100vh}
  .topbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;
    border-bottom:1px solid var(--line);background:rgba(6,12,28,.72);backdrop-filter:blur(18px);
  }
  .stage{flex:1;overflow-y:auto;padding:20px 22px 40px;scroll-behavior:smooth}

  .brand{display:flex;align-items:center;gap:11px;padding:2px 4px 10px;border-bottom:1px solid var(--line)}
  .mark{width:34px;height:34px;flex:0 0 34px;border-radius:12px;display:grid;place-items:center;
    background:radial-gradient(circle at 32% 26%,#2f5cb0,#0a1633 78%);box-shadow:0 0 0 1px var(--line),0 6px 22px rgba(40,90,200,.4)}
  .mark svg{width:22px;height:22px;filter:drop-shadow(0 0 6px rgba(190,215,255,.85));transition:transform .5s cubic-bezier(.2,1.2,.3,1)}
  .brand:hover .mark svg{transform:rotate(90deg) scale(1.06)}
  .brand b{font-size:15.5px;letter-spacing:-.2px;display:block;line-height:1.2}
  .brand span{font-size:11px;color:var(--mute);letter-spacing:.28px}

  .lbl{font-size:10.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute);padding:0 4px;display:flex;align-items:center;gap:7px}
  .lbl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;
    font:inherit;font-size:12.7px;font-weight:650;color:var(--ink);cursor:pointer;
    background:linear-gradient(180deg,rgba(30,50,96,.62),rgba(16,29,61,.62));
    border:1px solid var(--line);border-radius:11px;transition:.16s ease;white-space:nowrap;
  }
  .btn:hover{border-color:var(--line2);background:linear-gradient(180deg,rgba(42,68,128,.7),rgba(20,36,74,.7));transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.sm{height:29px;padding:0 10px;font-size:11.8px;border-radius:9px}
  .btn.ico{width:34px;padding:0;font-size:14px}
  .btn.ghost{background:transparent}
  .btn.on{border-color:rgba(138,182,255,.55);color:#fff;background:linear-gradient(180deg,rgba(52,92,180,.6),rgba(26,48,102,.6));box-shadow:0 0 20px rgba(88,140,255,.22) inset}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

  .seg{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:12px;background:rgba(8,16,38,.7)}
  .seg button{height:28px;padding:0 12px;font:inherit;font-size:12.2px;font-weight:700;color:var(--soft);
    background:transparent;border:0;border-radius:9px;cursor:pointer;transition:.15s}
  .seg button:hover{color:var(--ink)}
  .seg button.on{color:#fff;background:linear-gradient(180deg,rgba(58,100,190,.75),rgba(28,52,110,.75));box-shadow:0 1px 0 rgba(255,255,255,.09) inset}

  .field{display:flex;align-items:center;gap:8px;height:34px;padding:0 11px;border:1px solid var(--line);border-radius:11px;background:rgba(8,16,38,.66)}
  .field input,.field select{background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-size:12.8px;min-width:0;width:100%}
  .field select option{background:#0b1630}
  .field:focus-within{border-color:rgba(138,182,255,.5);box-shadow:0 0 0 3px rgba(88,140,255,.12)}
  input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.72) sepia(.4) saturate(4) hue-rotate(185deg);cursor:pointer}

  .daynav{display:grid;grid-template-columns:34px 1fr 34px;gap:7px}
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}

  .runs{display:flex;flex-direction:column;gap:8px}
  .run{
    position:relative;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;
    padding:11px 13px;border:1px solid var(--line);border-radius:15px;cursor:pointer;text-align:left;
    background:linear-gradient(180deg,rgba(16,29,61,.55),rgba(9,17,40,.55));color:var(--ink);font:inherit;transition:.16s ease;
  }
  .run:hover{transform:translateX(3px);border-color:var(--line2)}
  .run.on{border-color:rgba(138,182,255,.6);background:linear-gradient(180deg,rgba(40,74,150,.62),rgba(18,34,74,.62));box-shadow:0 0 24px rgba(80,130,240,.18)}
  .run.on::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:2px;border-radius:2px;background:linear-gradient(180deg,var(--beam),var(--halo))}
  .run .rt{font-size:13.2px;font-weight:650;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .run .rn{font-family:var(--mono);font-size:10.5px;color:var(--mute);align-self:start;padding-top:3px}
  .run .rm{grid-column:1/-1;display:flex;gap:6px;align-items:center;font-size:10.8px;color:var(--mute)}

  .pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 9px;border-radius:20px;
    font-size:10.4px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--line);color:var(--soft);background:rgba(10,20,45,.7)}
  .pill.easy{color:var(--mint);border-color:rgba(127,227,192,.36);background:rgba(127,227,192,.1)}
  .pill.medium{color:var(--amber);border-color:rgba(255,212,121,.36);background:rgba(255,212,121,.1)}
  .pill.hard,.pill.expert,.pill.insane{color:var(--ember);border-color:rgba(255,143,135,.36);background:rgba(255,143,135,.1)}
  .pill.beam{color:#cfe1ff;border-color:rgba(138,182,255,.4);background:rgba(138,182,255,.12);text-transform:none;letter-spacing:.2px}

  .board{display:flex;flex-direction:column;gap:6px}
  .brow{display:grid;grid-template-columns:18px 1fr auto;gap:9px;align-items:center;padding:7px 10px;border-radius:11px;background:rgba(12,23,50,.5);border:1px solid transparent}
  .brow:hover{border-color:var(--line)}
  .brow .rk{font-family:var(--mono);font-size:11px;color:var(--mute);text-align:center}
  .brow.top .rk{color:var(--blush)}
  .brow .nm{font-size:12.4px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brow .sc{font-family:var(--mono);font-size:11px;color:var(--soft)}
  .bar{grid-column:1/-1;height:3px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--beam),var(--halo))}

  .promptcard{
    position:relative;padding:20px 22px;margin-bottom:18px;border:1px solid var(--line);border-radius:22px;overflow:hidden;
    background:linear-gradient(180deg,rgba(18,32,68,.72),rgba(8,16,38,.6));box-shadow:0 20px 50px rgba(0,0,0,.42);
  }
  .promptcard::after{content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle,rgba(120,160,255,.18),transparent 68%);pointer-events:none}
  .promptcard h2{margin:0;font-size:21px;letter-spacing:-.35px;line-height:1.28}
  .prow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .meta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:12.3px;color:var(--mute);margin:9px 0 12px}
  .meta b{color:var(--soft);font-weight:650}
  .qt{margin:0;padding:12px 16px;border-radius:4px 16px 16px 4px;white-space:pre-wrap;color:#b8c8e4;font-size:14px;
    border-left:2px solid var(--beam);background:linear-gradient(90deg,rgba(138,182,255,.10),rgba(138,182,255,.02))}
  .qt.clip{max-height:112px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent)}

  .picker{position:sticky;top:-1px;z-index:20;margin:0 0 18px;padding:12px 14px;border:1px solid var(--line);border-radius:18px;
    background:rgba(7,14,32,.86);backdrop-filter:blur(18px);box-shadow:0 12px 34px rgba(0,0,0,.35)}
  .picker .head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px}
  .chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:9px}
  .chip{
    display:grid;grid-template-columns:26px 1fr 8px;align-items:center;gap:9px;height:46px;padding:0 11px;
    border:1px solid var(--line);border-radius:14px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);
    background:linear-gradient(180deg,rgba(18,32,68,.5),rgba(9,17,40,.5));transition:.16s ease;
  }
  .chip:hover{border-color:var(--line2);transform:translateY(-2px)}
  .chip.on{border-color:rgba(138,182,255,.62);background:linear-gradient(180deg,rgba(44,82,164,.6),rgba(20,38,84,.6));box-shadow:0 0 26px rgba(80,130,240,.2)}
  .chip.dim{opacity:.42}
  .chip .txt{min-width:0}
  .chip .n{font-size:12.7px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip .s{font-size:10.4px;color:var(--mute);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .av{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:10.5px;font-weight:850;color:#06101f;letter-spacing:-.3px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
  .dot.ok{background:var(--mint);box-shadow:0 0 9px rgba(127,227,192,.6)}
  .dot.err{background:var(--ember);box-shadow:0 0 9px rgba(255,143,135,.6)}
  .dot.load{animation:blink 1.1s infinite}
  @keyframes blink{0%,100%{opacity:.22}50%{opacity:1}}

  .deck{display:grid;gap:18px;align-items:start}
  .deck.all{grid-template-columns:repeat(auto-fit,minmax(430px,1fr))}
  .deck.compare{grid-template-columns:1fr 1fr}
  .deck.focus{grid-template-columns:1fr;max-width:1180px;margin:0 auto}

  .card{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;
    background:linear-gradient(180deg,rgba(14,26,56,.72),rgba(7,14,34,.72));box-shadow:0 18px 44px rgba(0,0,0,.4)}
  .card.win{border-color:rgba(255,179,210,.42);box-shadow:0 0 0 1px rgba(255,179,210,.16),0 18px 44px rgba(0,0,0,.4)}
  .chead{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(24,42,88,.6),rgba(12,23,52,.6));position:sticky;top:0;z-index:6;backdrop-filter:blur(8px)}
  .chead .who{min-width:0;flex:1}
  .chead .who b{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chead .who i{display:block;font-style:normal;font-family:var(--mono);font-size:10.4px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cbody{padding:4px 18px 16px;overflow-y:auto;max-height:72vh}
  .deck.focus .cbody{max-height:none}
  .card.tall .cbody{max-height:none}
  .cfoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 14px;border-top:1px solid var(--line);
    background:rgba(8,16,38,.6);font-family:var(--mono);font-size:11px;color:var(--mute)}
  .rate{display:flex;align-items:center;gap:3px;margin-left:auto}
  .rate button{background:none;border:0;cursor:pointer;padding:2px;line-height:1;color:rgba(160,185,230,.34);font-size:14px;transition:.14s}
  .rate button:hover{transform:scale(1.22);color:var(--blush)}
  .rate button.lit{color:var(--blush);filter:drop-shadow(0 0 6px rgba(255,179,210,.5))}

  .md h1,.md h2,.md h3,.md h4{line-height:1.32;margin:20px 0 9px;letter-spacing:-.25px}
  .md h1{font-size:21px}.md h2{font-size:18.5px}.md h3{font-size:16px}.md h4{font-size:14.5px}
  .md h1,.md h2{padding-bottom:6px;border-bottom:1px solid var(--line)}
  .md p{margin:10px 0}
  .md ul,.md ol{margin:10px 0;padding-left:22px}
  .md li{margin:5px 0}
  .md li::marker{color:var(--beam)}
  .md a{color:var(--beam);text-decoration:none;border-bottom:1px solid rgba(138,182,255,.32)}
  .md a:hover{border-bottom-color:var(--beam)}
  .md blockquote{margin:12px 0;padding:8px 15px;border-left:2px solid var(--halo);border-radius:0 12px 12px 0;color:var(--soft);background:rgba(169,162,255,.07)}
  .md hr{border:0;height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent);margin:20px 0}
  .md img{max-width:100%;border-radius:14px}
  .md table{width:100%;border-collapse:collapse;margin:13px 0;font-size:13.4px;display:block;overflow-x:auto}
  .md th,.md td{border:1px solid var(--line);padding:8px 11px;text-align:left}
  .md th{background:rgba(24,42,88,.5);font-weight:700}
  .md tbody tr:nth-child(even){background:rgba(255,255,255,.018)}
  .md :not(pre)>code{font-family:var(--mono);font-size:12.4px;padding:2px 6px;border-radius:6px;color:#d9c6ff;background:rgba(140,120,255,.15);border:1px solid rgba(150,130,255,.18)}

  .cb{margin:15px 0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#070d1e}
  .cbbar{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 13px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(24,42,88,.55),rgba(12,23,52,.55))}
  .cbbar .lg{font-family:var(--mono);font-size:10.6px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--beam)}
  .cbtabs{display:flex;gap:2px;padding:2px;border-radius:9px;background:rgba(0,0,0,.34)}
  .cbtabs button{height:23px;padding:0 11px;font:inherit;font-size:11.2px;font-weight:750;color:var(--mute);background:none;border:0;border-radius:7px;cursor:pointer}
  .cbtabs button.on{color:#fff;background:rgba(58,100,190,.7)}
  .acts{margin-left:auto;display:flex;gap:3px}
  .ib{height:26px;padding:0 9px;font:inherit;font-size:11.3px;font-weight:650;color:var(--mute);background:transparent;
    border:1px solid transparent;border-radius:8px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:5px}
  .ib:hover{color:var(--ink);background:rgba(255,255,255,.07);border-color:var(--line)}
  .ib.done{color:var(--mint)}
  .cb pre{margin:0;padding:15px;overflow:auto;max-height:440px;font-family:var(--mono);font-size:12.5px;line-height:1.62;background:transparent}
  .cb pre code{background:none;padding:0;border:0;font-family:inherit}
  .cb pre.wrap code{white-space:pre-wrap;word-break:break-word}
  .pane{display:none}.pane.on{display:block}
  .fw{position:relative;background:#fff}
  .fw iframe{display:block;width:100%;height:var(--frame-h);border:0;background:#fff;transition:height .18s ease}
  .deck.focus .fw iframe{height:calc(var(--frame-h) + 180px)}
  .grip{height:13px;display:grid;place-items:center;cursor:ns-resize;border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(24,42,88,.6),rgba(12,23,52,.6))}
  .grip::after{content:"";width:46px;height:3px;border-radius:3px;background:var(--line2)}

  .skel{height:12px;border-radius:7px;margin:11px 0;background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.09),rgba(255,255,255,.03));background-size:280% 100%;animation:sh 1.5s infinite}
  @keyframes sh{0%{background-position:110% 0}100%{background-position:-110% 0}}
  .err{padding:14px 16px;border:1px solid rgba(255,143,135,.34);border-radius:14px;background:rgba(255,143,135,.08);color:#ffc2bd;font-size:13.4px}
  .empty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:70px 20px;text-align:center;color:var(--mute)}
  .empty svg{width:78px;height:78px;opacity:.2;animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(9deg)}}
  .empty b{display:block;font-size:16px;color:var(--soft);font-weight:650}

  .modal{position:fixed;inset:0;z-index:120;display:none;flex-direction:column;gap:12px;padding:20px;
    background:rgba(3,7,18,.9);backdrop-filter:blur(10px)}
  .modal.on{display:flex}
  .mbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--soft);font-size:13px}
  .mstage{flex:1;display:grid;place-items:center;overflow:auto;background:repeating-conic-gradient(rgba(255,255,255,.03) 0 25%,transparent 0 50%) 50%/22px 22px;border-radius:18px}
  .mstage iframe{width:100%;height:100%;max-width:100%;border:0;border-radius:14px;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.6)}

  .toast{position:fixed;left:50%;bottom:26px;z-index:200;transform:translate(-50%,26px);opacity:0;pointer-events:none;
    display:flex;align-items:center;gap:9px;padding:10px 18px;border:1px solid var(--line2);border-radius:24px;
    background:rgba(16,29,61,.95);color:var(--ink);font-size:13px;font-weight:600;transition:.22s;box-shadow:0 14px 40px rgba(0,0,0,.55)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .kbd{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--soft)}
  .keys{display:flex;flex-direction:column;gap:6px;font-size:11.6px;color:var(--mute)}
  .keys div{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .drawer-btn{display:none}
  @media(max-width:1080px){
    .deck.all{grid-template-columns:1fr}
    .deck.compare{grid-template-columns:1fr}
  }
  @media(max-width:860px){
    .app{grid-template-columns:1fr}
    .rail{position:fixed;z-index:80;top:0;bottom:0;left:0;width:290px;transform:translateX(-104%);transition:.24s ease}
    .rail.open{transform:none;box-shadow:40px 0 80px rgba(0,0,0,.6)}
    .drawer-btn{display:inline-flex}
    .stage{padding:14px}
  }
</style>
</head>
<body>
<div id="sky"></div>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">
      <span class="mark" id="logo"></span>
      <span><b>Starfall Arena</b><span>rankmodels · side-by-side</span></span>
    </div>

    <div class="lbl">Session</div>
    <div class="daynav">
      <button class="btn ico" id="prev-day" title="Previous day">‹</button>
      <div class="field"><input type="date" id="date-in"></div>

  <div class="col">
    <header class="topbar">

        <button data-view="focus">Focus</button>
        <button data-view="compare">Compare</button>
        <button data-view="all">All</button>

        <span style="color:var(--mute);font-size:12px">⌕</span>
        <input id="filter" placeholder="Filter models…" autocomplete="off">

      <div class="field" style="width:168px">
        <select id="sort">
          <option value="order">Prompt order</option>
          <option value="az">Name A→Z</option>

<div class="modal" id="modal">
  <div class="mbar">
    <strong id="m-title">Preview</strong>

      <button data-w="390">390</button>
      <button data-w="768">768</button>

<div class="toast" id="toast"></div>

<script>
const MODEL_PATHS={
  "claude-opus-5":"claude/claude-opus-5",
  "claude-opus-4.8":"claude/claude-opus-4.8",
  "gpt-5.6-sol":"openai/gpt-5.6-sol",
  "gemini-3.7-flash":"gemini/gemini-3.7-flash",
  "kimi-k3": "moonshot/kimi-k3",
  "deepseek-v4-pro": "deepseek/deepseek-v4-pro",
  "deepseek-v4-pro-0813": "deepseek/deepseek-v4-pro-0813",
  "grok-4.6":"grok/grok-4.6"
};
const ROOT="./prompts";
const MAX_RUNS=14;
const STAR="M50 4 55.36 37.07 82.53 17.47 62.93 44.64 96 50 62.93 55.36 82.53 82.53 55.36 62.93 50 96 44.64 62.93 17.47 82.53 37.07 55.36 4 50 37.07 44.64 17.47 17.47 44.64 37.07";
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const S={date:"",runs:[],run:null,models:[],view:"focus",sort:"order",query:"",blind:false,tall:false,
  focus:null,pair:[null,null],cards:new Map(),info:new Map(),judge:{},manifest:null,order:[]};
const FRAMES=new WeakMap();
let modalCode="",modalKind="html",toastT;

function starSvg(size,fill){return '<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+'"><polygon points="'+STAR+'" fill="'+(fill||"#fff")+'"/></svg>';}
$("#logo").innerHTML=starSvg(22);
(function sky(){
  const box=$("#sky"),n=26,ns="http://www.w3.org/2000/svg";
  for(let i=0;i<n;i++){
    const s=document.createElementNS(ns,"svg"),p=document.createElementNS(ns,"polygon");
    const sz=4+Math.random()*13;
    s.setAttribute("viewBox","0 0 100 100");s.setAttribute("class","glim");
    s.style.width=sz+"px";s.style.height=sz+"px";
    s.style.left=(Math.random()*100).toFixed(2)+"%";s.style.top=(Math.random()*100).toFixed(2)+"%";
    s.style.animationDelay=(Math.random()*6).toFixed(2)+"s";
    s.style.animationDuration=(4+Math.random()*6).toFixed(2)+"s";
    p.setAttribute("points",STAR);s.appendChild(p);box.appendChild(s);
  }
})();

function toast(msg){const t=$("#toast");t.innerHTML=starSvg(11,"#ffb3d2")+"<span>"+esc(msg)+"</span>";t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1700);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function clean(h){return window.DOMPurify?DOMPurify.sanitize(h,{USE_PROFILES:{html:true}}):h;}
function bytes(n){return n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB";}
function pad(n){return String(n).padStart(2,"0");}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function shiftDate(ds,delta){const[y,m,d]=ds.split("-").map(Number);const dt=new Date(y,m-1,d+delta);return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate());}
function prettyDate(ds){const[y,m,d]=ds.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function runPath(date,id){const[y,m,d]=date.split("-");return ROOT+"/"+y+"-"+m+"/"+d+"/"+id;}
function provider(id){const p=(MODEL_PATHS[id]||id).split("/");return p.length>1?p[0]:(id.split(/[-.]/)[0]||id);}
function initials(id){const c=id.replace(/[^a-z0-9]/gi," ").trim().split(/\s+/);return((c[0]||"?")[0]+(c[1]?c[1][0]:(c[0]||"?")[1]||"")).toUpperCase();}
function hue(id){let h=0;for(let i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))%360;return h;}
function grad(id){const h=hue(id);return"linear-gradient(135deg,hsl("+h+",78%,72%),hsl("+((h+58)%360)+",76%,62%))";}
function alias(i){return"Model "+String.fromCharCode(65+i);}
function label(id){const i=S.order.indexOf(id);return S.blind?alias(i<0?0:i):id;}

async function copyText(t,btn){
  try{await navigator.clipboard.writeText(t);}
  catch(e){const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){ }a.remove();}
  if(btn){const o=btn.textContent;btn.textContent="Copied ✓";btn.classList.add("done");setTimeout(()=>{btn.textContent=o;btn.classList.remove("done")},1300);}
  toast("Copied to clipboard");
}
const JKEY="starfall-judge-v1";
function loadJudge(){try{S.judge=JSON.parse(localStorage.getItem(JKEY)||"{}")}catch(e){S.judge={}}}
function saveJudge(){try{localStorage.setItem(JKEY,JSON.stringify(S.judge))}catch(e){}}
function runKey(){return S.run?S.date+"/"+S.run.id:"";}
function judgeFor(){const k=runKey();if(!k)return{ratings:{}};if(!S.judge[k])S.judge[k]={ratings:{}};if(!S.judge[k].ratings)S.judge[k].ratings={};return S.judge[k];}

if(window.marked)marked.setOptions({gfm:true,breaks:false,headerIds:false,mangle:false});
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const d=FRAMES.get(e.target);if(d&&!e.target.dataset.loaded){e.target.srcdoc=d;e.target.dataset.loaded="1";}io.unobserve(e.target);});},{rootMargin:"420px"});

function wrapDoc(code,kind){
  if(kind==="svg")return"<!DOCTYPE html><html><head><meta charset='utf-8'><style>html,body{margin:0;height:100%;display:grid;place-items:center;background:#fff}svg{max-width:96%;max-height:96%}</style></head><body>"+code+"</body></html>";
  if(/<!doctype/i.test(code)||/<html[\s>]/i.test(code))return code;
  return"<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'></head><body>"+code+"</body></html>";
}
function kindOf(lang,code){
  const l=(lang||"").toLowerCase();
  if(["html","htm","xhtml","html5"].includes(l))return"html";
  if(l==="svg")return"svg";
  if(!l||["markup","xml","text","plaintext"].includes(l)){
    const h=code.trim().slice(0,400).toLowerCase();
    if(h.startsWith("<svg"))return"svg";
    if(h.includes("<!doctype html")||h.includes("<html"))return"html";
  }
  return null;
}
function openModal(code,kind,title){
  modalCode=code;modalKind=kind;
  $("#m-title").textContent=title||"Preview";
  $("#m-frame").srcdoc=wrapDoc(code,kind);
  $("#modal").classList.add("on");
}
function closeModal(){$("#modal").classList.remove("on");$("#m-frame").srcdoc="";modalCode="";}
$("#m-close").onclick=closeModal;
$("#m-copy").onclick=e=>copyText(modalCode,e.currentTarget);
$("#m-reload").onclick=()=>{const f=$("#m-frame");f.srcdoc="";f.srcdoc=wrapDoc(modalCode,modalKind);toast("Preview re-ran");};
$("#m-widths").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  [...$("#m-widths").children].forEach(x=>x.classList.toggle("on",x===b));
  const w=+b.dataset.w;const f=$("#m-frame");
  f.style.maxWidth=w?w+"px":"100%";
  $("#m-size").textContent=w?w+"px":"full";
};
function mkBtn(label,title,fn){const b=document.createElement("button");b.className="ib";b.type="button";b.textContent=label;b.title=title;b.onclick=()=>fn(b);return b;}

function enhance(root,modelId){
  const blocks=[...root.querySelectorAll("pre > code")];
  let previews=0;
  blocks.forEach((codeEl,i)=>{
    const pre=codeEl.parentElement,raw=codeEl.textContent;
    const lc=[...codeEl.classList].find(c=>c.startsWith("language-"));
    const lang=lc?lc.slice(9):"";
    if(window.hljs){try{hljs.highlightElement(codeEl)}catch(e){}}
    const kind=kindOf(lang,raw);
    const box=document.createElement("div");box.className="cb";
    pre.parentNode.insertBefore(box,pre);
    const bar=document.createElement("div");bar.className="cbbar";
    const tag=document.createElement("span");tag.className="lg";tag.textContent=lang||kind||"code";bar.appendChild(tag);
    const codePane=document.createElement("div");codePane.className="pane";codePane.appendChild(pre);
    let prevPane=null,frame=null;
    if(kind){
      previews++;
      prevPane=document.createElement("div");prevPane.className="pane";
      const fw=document.createElement("div");fw.className="fw";
      frame=document.createElement("iframe");
      frame.setAttribute("sandbox","allow-scripts allow-modals allow-popups allow-forms allow-pointer-lock");
      frame.setAttribute("loading","lazy");frame.title=modelId+" preview "+(i+1);
      fw.appendChild(frame);
      const grip=document.createElement("div");grip.className="grip";
      grip.addEventListener("pointerdown",ev=>{
        ev.preventDefault();const y0=ev.clientY,h0=frame.clientHeight;
        const mv=m=>{frame.style.height=Math.max(180,h0+(m.clientY-y0))+"px";};
        const up=()=>{document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);};
        document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);
      });
      prevPane.appendChild(fw);prevPane.appendChild(grip);
      const tabs=document.createElement("div");tabs.className="cbtabs";
      const tP=document.createElement("button"),tC=document.createElement("button");
      tP.type=tC.type="button";tP.textContent="Preview";tC.textContent="Code";
      const sel=p=>{tP.classList.toggle("on",p);tC.classList.toggle("on",!p);prevPane.classList.toggle("on",p);codePane.classList.toggle("on",!p);};
      tP.onclick=()=>sel(true);tC.onclick=()=>sel(false);
      tabs.append(tP,tC);bar.appendChild(tabs);sel(true);
      FRAMES.set(frame,wrapDoc(raw,kind));io.observe(frame);
    }else codePane.classList.add("on");
    const acts=document.createElement("div");acts.className="acts";
    if(kind){
      acts.appendChild(mkBtn("↻","Re-run preview",()=>{frame.dataset.loaded="1";frame.srcdoc="";frame.srcdoc=wrapDoc(raw,kind);toast("Preview re-ran");}));
      acts.appendChild(mkBtn("⛶","Fullscreen",()=>openModal(raw,kind,label(modelId)+" · "+(lang||kind))));
      acts.appendChild(mkBtn("↗","Open in new tab",()=>{const u=URL.createObjectURL(new Blob([wrapDoc(raw,kind)],{type:"text/html"}));window.open(u,"_blank","noopener");setTimeout(()=>URL.revokeObjectURL(u),3e4);}));
      acts.appendChild(mkBtn("⭳","Download",()=>{const ext=kind==="svg"?"svg":"html";const a=document.createElement("a");
        a.href=URL.createObjectURL(new Blob([raw],{type:kind==="svg"?"image/svg+xml":"text/html"}));
        a.download=modelId.replace(/[^\w.-]/g,"_")+"-"+(i+1)+"."+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),15000);}));
    }
    acts.appendChild(mkBtn("⇌","Word wrap",()=>pre.classList.toggle("wrap")));
    acts.appendChild(mkBtn("Copy","Copy code",b=>copyText(raw,b)));
    bar.appendChild(acts);
    box.appendChild(bar);
    if(prevPane)box.appendChild(prevPane);
    box.appendChild(codePane);
  });
  return{blocks:blocks.length,previews};
}

function buildCard(modelId,subPath){
  const card=document.createElement("article");
  card.className="card";card.dataset.model=modelId;
  const head=document.createElement("div");head.className="chead";
  head.innerHTML='<span class="av" style="background:'+grad(modelId)+'">'+esc(initials(modelId))+'</span>'+
    '<span class="who"><b data-slot="name"></b><i data-slot="path"></i></span>'+
    '<span class="dot load" data-slot="dot"></span>';
  const bCopy=document.createElement("button");bCopy.className="ib";bCopy.textContent="Copy MD";bCopy.title="Copy raw markdown";
  bCopy.onclick=e=>{const inf=S.info.get(modelId);inf&&inf.md?copyText(inf.md,e.currentTarget):toast("Nothing loaded yet");};
  const bSolo=document.createElement("button");bSolo.className="ib";bSolo.textContent="Solo";bSolo.title="Focus this model";
  bSolo.onclick=()=>{S.focus=modelId;setView("focus");};
  head.append(bCopy,bSolo);
  const body=document.createElement("div");body.className="cbody md";
  body.innerHTML='<div class="skel" style="width:64%"></div><div class="skel" style="width:96%"></div><div class="skel" style="width:88%"></div><div class="skel" style="width:42%"></div>';
  const foot=document.createElement("div");foot.className="cfoot";
  const stats=document.createElement("span");stats.dataset.slot="stats";stats.textContent="fetching…";
  const rate=document.createElement("div");rate.className="rate";
  const crown=document.createElement("button");crown.title="Pick as winner";crown.textContent="♛";crown.dataset.slot="crown";
  crown.onclick=()=>{const j=judgeFor();j.winner=j.winner===modelId?null:modelId;saveJudge();paintVotes();renderBoard();toast(j.winner?label(modelId)+" takes the round":"Winner cleared");};
  rate.appendChild(crown);
  for(let i=1;i<=5;i++){
    const b=document.createElement("button");b.dataset.v=i;b.title=i+" / 5";b.innerHTML="✦";
    b.onclick=()=>{const j=judgeFor();j.ratings[modelId]=j.ratings[modelId]===i?0:i;saveJudge();paintVotes();renderBoard();};
    rate.appendChild(b);
  }
  foot.append(stats,rate);
  card.append(head,body,foot);
  return card;
}
function paintNames(){
  S.cards.forEach((card,id)=>{
    const inf=S.info.get(id)||{};
    card.querySelector('[data-slot="name"]').textContent=label(id);
    card.querySelector('[data-slot="path"]').textContent=S.blind?"hidden while blind":(inf.path||"");
  });
  renderPicker();renderBoard();
}
function paintVotes(){
  const j=judgeFor();
  S.cards.forEach((card,id)=>{
    const v=j.ratings[id]||0;
    card.querySelectorAll(".rate button[data-v]").forEach(b=>b.classList.toggle("lit",+b.dataset.v<=v));
    const c=card.querySelector('[data-slot="crown"]');
    c.classList.toggle("lit",j.winner===id);
    card.classList.toggle("win",j.winner===id);
  });
}

async function loadModel(modelId,subPath,card){
  const body=card.querySelector(".cbody"),dot=card.querySelector('[data-slot="dot"]'),stats=card.querySelector('[data-slot="stats"]');
  const file=S.run.path+"/"+subPath+"/response.md";
  card.querySelector('[data-slot="name"]').textContent=label(modelId);
  card.querySelector('[data-slot="path"]').textContent=S.blind?"hidden while blind":subPath+"/response.md";
  const t0=performance.now();
  try{
    const res=await fetch(file,{cache:"no-store"});
    if(!res.ok)throw new Error(res.status+" "+res.statusText);
    const md=await res.text();
    if(!md.trim())throw new Error("empty file");
    body.innerHTML=clean(marked.parse(md));
    const st=enhance(body,modelId);
    const words=md.split(/\s+/).filter(Boolean).length;
    dot.className="dot ok";
    stats.textContent=bytes(new Blob([md]).size)+" · "+words+" words · "+st.blocks+" blocks · "+st.previews+" live · "+Math.round(performance.now()-t0)+"ms";
    S.info.set(modelId,{md,path:subPath+"/response.md",words,size:md.length,ok:true});
  }catch(err){
    dot.className="dot err";stats.textContent="unavailable";
    body.innerHTML='<div class="err"><b>No response yet.</b><br><span style="font-family:var(--mono);font-size:12px">'+esc(file)+'</span><br><small>'+esc(err.message)+'</small></div>';
    const r=document.createElement("button");r.className="btn sm";r.style.marginTop="12px";r.textContent="Retry";
    r.onclick=()=>{body.innerHTML='<div class="skel" style="width:70%"></div><div class="skel" style="width:90%"></div>';dot.className="dot load";loadModel(modelId,subPath,card);};
    body.appendChild(r);
    S.info.set(modelId,{md:"",path:subPath+"/response.md",words:0,size:0,ok:false});
  }
  renderPicker();
}

async function probe(date,id){
  try{
    const p=runPath(date,id);
    const r=await fetch(p+"/prompt.json",{cache:"no-store"});
    if(!r.ok)return null;
    const data=await r.json();
    return{id,date,path:p,data};
  }catch(e){return null;}
}
async function loadManifest(){
  try{const r=await fetch(ROOT+"/index.json",{cache:"no-store"});if(!r.ok)return null;const j=await r.json();return Array.isArray(j)?{runs:j}:j;}
  catch(e){return null;}
}
async function findRuns(date){
  let ids=[];
  if(S.manifest&&Array.isArray(S.manifest.runs)){
    ids=S.manifest.runs.filter(r=>r.date===date).map(r=>String(r.id));
  }
  if(!ids.length)ids=Array.from({length:MAX_RUNS},(_,i)=>pad(i+1));
  const found=(await Promise.all(ids.map(id=>probe(date,id)))).filter(Boolean);
  found.sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
  return found;
}
async function hunt(from,dir,limit){
  let d=from;
  for(let i=0;i<limit;i++){
    d=shiftDate(d,dir);
    const r=await probe(d,"01");
    if(r)return d;
  }
  return null;
}

function renderRunList(){
  const box=$("#run-list");box.innerHTML="";
  $("#run-count").textContent=S.runs.length;
  if(!S.runs.length){
    box.innerHTML='<div style="padding:14px;border:1px dashed var(--line);border-radius:14px;color:var(--mute);font-size:12.4px;text-align:center">Nothing on this day.</div>';
    return;
  }
  S.runs.forEach(r=>{
    const b=document.createElement("button");
    b.className="run"+(S.run&&S.run.id===r.id?" on":"");
    const d=(r.data.difficulty||"unrated").toString();
    const n=(r.data.models_tested||[]).length;
    const j=S.judge[r.date+"/"+r.id];
    b.innerHTML='<span class="rt">'+esc(r.data.title||"Untitled")+'</span><span class="rn">#'+esc(r.id)+'</span>'+
      '<span class="rm"><span class="pill '+esc(d.toLowerCase())+'">'+esc(d)+'</span><span>'+n+' models</span>'+
      (j&&j.winner?'<span style="color:var(--blush)">✦ judged</span>':'')+'</span>';
    b.onclick=()=>selectRun(r);
    box.appendChild(b);
  });
}
function renderBoard(){
  const tally={};
  Object.values(S.judge).forEach(j=>{
    if(j.winner){tally[j.winner]=tally[j.winner]||{w:0,sum:0,n:0};tally[j.winner].w++;}
    Object.entries(j.ratings||{}).forEach(([m,v])=>{if(!v)return;tally[m]=tally[m]||{w:0,sum:0,n:0};tally[m].sum+=v;tally[m].n++;});
  });
  const rows=Object.entries(tally).map(([m,t])=>({m,w:t.w,avg:t.n?t.sum/t.n:0,n:t.n}))
    .sort((a,b)=>b.w-a.w||b.avg-a.avg||a.m.localeCompare(b.m));
  const box=$("#board");box.innerHTML="";
  if(!rows.length){box.innerHTML='<div style="padding:12px;border:1px dashed var(--line);border-radius:13px;color:var(--mute);font-size:12px;text-align:center">Rate a few answers with ✦ to build a board.</div>';return;}
  const max=Math.max(...rows.map(r=>r.w))||1;
  rows.slice(0,8).forEach((r,i)=>{
    const el=document.createElement("div");el.className="brow"+(i===0?" top":"");
    el.innerHTML='<span class="rk">'+(i+1)+'</span><span class="nm">'+esc(S.blind?"—":r.m)+'</span>'+
      '<span class="sc">'+r.w+'W · '+(r.avg?r.avg.toFixed(1):"–")+'✦</span><span class="bar"><i style="width:'+Math.round(r.w/max*100)+'%"></i></span>';
    box.appendChild(el);
  });
}
function renderPrompt(){
  const box=$("#prompt-card");
  if(!S.run){
    box.innerHTML='<div class="empty">'+starSvg(78,"#8ab6ff")+'<b>No run selected</b><span>Pick a date, hit Latest, or roll a Random prompt.</span></div>';
    return;
  }
  const d=S.run.data,diff=(d.difficulty||"unrated").toString();
  const models=d.models_tested||[];
  box.innerHTML=
    '<div class="prow"><h2>'+esc(d.title||"Untitled prompt")+'</h2>'+
      '<span class="pill '+esc(diff.toLowerCase())+'">'+esc(diff)+'</span>'+
      '<span class="pill beam">'+models.length+' models</span>'+
      '<span class="pill beam">#'+esc(S.run.id)+'</span></div>'+
    '<div class="meta"><span>'+esc(prettyDate(S.run.date))+'</span><span>·</span>'+
      '<span>by <b>'+esc(d.submitted_by||"anonymous")+'</b></span><span>·</span>'+
      '<span style="font-family:var(--mono)">'+esc(S.run.path)+'</span></div>'+
    '<blockquote class="qt clip" id="qt">'+esc(d.prompt||"")+'</blockquote>'+
    '<div class="prow" style="margin-top:12px">'+
      '<button class="btn sm" id="qt-more">Expand prompt</button>'+
      '<button class="btn sm" id="qt-copy">Copy prompt</button>'+
      '<button class="btn sm ghost" id="link">Copy link</button></div>';
  const qt=$("#qt");
  if(qt.scrollHeight<=118){qt.classList.remove("clip");$("#qt-more").style.display="none";}
  $("#qt-more").onclick=e=>{const c=qt.classList.toggle("clip");e.currentTarget.textContent=c?"Expand prompt":"Collapse prompt";};
  $("#qt-copy").onclick=e=>copyText(d.prompt||"",e.currentTarget);
  $("#link").onclick=e=>copyText(location.origin+location.pathname+"?date="+S.date+"&run="+S.run.id+"&view="+S.view,e.currentTarget);
}
function sortedModels(){
  const arr=[...S.models];
  const j=judgeFor();
  const by={
    order:()=>0,
    az:(a,b)=>a.localeCompare(b),
    provider:(a,b)=>provider(a).localeCompare(provider(b))||a.localeCompare(b),
    size:(a,b)=>((S.info.get(b)||{}).size||0)-((S.info.get(a)||{}).size||0),
    score:(a,b)=>((j.ratings[b]||0)-(j.ratings[a]||0))||a.localeCompare(b)
  };
  return arr.sort(by[S.sort]||by.order);
}
function matches(id){
  if(!S.query)return true;
  const q=S.query.toLowerCase();
  return label(id).toLowerCase().includes(q)||(S.blind?false:provider(id).toLowerCase().includes(q));
}
function renderPicker(){
  const box=$("#picker");
  if(!S.run||!S.models.length){box.style.display="none";return;}
  box.style.display="";
  const list=sortedModels();
  const active=S.view==="focus"?[S.focus]:S.view==="compare"?S.pair:list;
  box.innerHTML='<div class="head"><span class="lbl" style="padding:0">'+
    (S.view==="focus"?"Choose one":S.view==="compare"?"Choose two":"All entries")+
    '</span><span class="pill beam" id="pos"></span><span style="flex:1"></span>'+
    '<button class="btn sm ghost" id="prev-m">‹ Prev</button><button class="btn sm ghost" id="next-m">Next ›</button>'+
    '<button class="btn sm ghost" id="shuffle">Shuffle</button></div><div class="chips" id="chips"></div>';
  const chips=$("#chips");
  list.forEach(id=>{
    const inf=S.info.get(id)||{};
    const on=active.includes(id);
    const b=document.createElement("button");
    b.className="chip"+(on?" on":"")+(matches(id)?"":" dim");
    b.innerHTML='<span class="av" style="background:'+grad(id)+'">'+esc(S.blind?alias(S.order.indexOf(id)).slice(-1):initials(id))+'</span>'+
      '<span class="txt"><span class="n">'+esc(label(id))+'</span><span class="s">'+
      (inf.words?inf.words+" words":inf.ok===false?"unavailable":"loading…")+'</span></span>'+
      '<span class="dot '+(inf.ok===true?"ok":inf.ok===false?"err":"load")+'"></span>';
    b.onclick=()=>pick(id);
    chips.appendChild(b);
  });
  const idx=list.indexOf(S.focus);
  $("#pos").textContent=S.view==="focus"?(idx+1)+" / "+list.length:S.view==="compare"?(S.pair.filter(Boolean).length)+" / 2":list.length+" shown";
  $("#prev-m").onclick=()=>step(-1);
  $("#next-m").onclick=()=>step(1);
  $("#shuffle").onclick=()=>{S.models=S.models.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);S.order=[...S.models];renderPicker();renderDeck();toast("Order shuffled ✦");};
}
function pick(id){
  if(S.view==="focus"){S.focus=id;}
  else if(S.view==="compare"){
    if(S.pair[0]===id){S.pair[0]=S.pair[1];S.pair[1]=null;}
    else if(S.pair[1]===id){S.pair[1]=null;}
    else if(!S.pair[0])S.pair[0]=id;
    else if(!S.pair[1])S.pair[1]=id;
    else{S.pair[0]=S.pair[1];S.pair[1]=id;}
  }else{
    S.focus=id;
    const c=S.cards.get(id);
    if(c)c.scrollIntoView({behavior:"smooth",block:"start"});
    return renderPicker();
  }
  renderPicker();renderDeck();syncURL();
}
function step(d){
  const list=sortedModels().filter(matches);
  if(!list.length)return;
  if(S.view==="compare"){
    const cur=S.pair[1]||S.pair[0]||list[0];
    const n=list[(list.indexOf(cur)+d+list.length)%list.length];
    S.pair=[S.pair[0]||list[0],n];
  }else{
    const i=list.indexOf(S.focus);
    S.focus=list[((i<0?0:i)+d+list.length)%list.length];
  }
  renderPicker();renderDeck();syncURL();
  $("#stage").scrollTo({top:$("#picker").offsetTop-8,behavior:"smooth"});
}
function renderDeck(){
  const deck=$("#deck");
  deck.className="deck "+S.view;
  while(deck.firstChild)deck.removeChild(deck.firstChild);
  if(!S.run){
    deck.innerHTML='<div class="empty">'+starSvg(78,"#8ab6ff")+'<b>Nothing loaded</b><span>Choose a run from the left rail to start the comparison.</span></div>';
    return;
  }
  let show=[];
  if(S.view==="focus")show=S.focus?[S.focus]:[];
  else if(S.view==="compare")show=S.pair.filter(Boolean);
  else show=sortedModels().filter(matches);
  if(!show.length){
    deck.innerHTML='<div class="empty">'+starSvg(78,"#a9a2ff")+'<b>Pick a model above</b><span>'+(S.view==="compare"?"Select up to two entries to place side by side.":"Nothing matches that filter.")+'</span></div>';
    return;
  }
  show.forEach(id=>{
    const c=S.cards.get(id);
    if(!c)return;
    c.classList.toggle("tall",S.tall||S.view==="focus");
    c.querySelectorAll("iframe").forEach(f=>{if(!f.dataset.loaded)io.observe(f);});
    deck.appendChild(c);
  });
  paintVotes();
}
function setView(v){
  S.view=v;
  [...$("#view-seg").children].forEach(b=>b.classList.toggle("on",b.dataset.view===v));
  const list=sortedModels().filter(matches);
  if(v==="focus"&&!S.focus)S.focus=list[0]||null;
  if(v==="compare"&&!S.pair.filter(Boolean).length)S.pair=[list[0]||null,list[1]||null];
  try{localStorage.setItem("starfall-view",v)}catch(e){}
  renderPicker();renderDeck();syncURL();
}
function syncURL(){
  if(!S.run)return;
  const p=new URLSearchParams({date:S.date,run:S.run.id,view:S.view});
  if(S.view==="focus"&&S.focus)p.set("model",S.focus);
  history.replaceState(null,"",location.pathname+"?"+p.toString());
}
function selectRun(r,keepModel){
  S.run=r;
  S.cards.clear();S.info.clear();
  S.models=(r.data.models_tested||[]).slice();
  S.order=[...S.models];
  if(!keepModel||!S.models.includes(S.focus))S.focus=S.models[0]||null;
  S.pair=[S.models[0]||null,S.models[1]||null];
  renderRunList();renderPrompt();
  const map=Object.assign({},MODEL_PATHS,r.data.model_paths||{});
  S.models.forEach(id=>{
    const sub=map[id]||id;
    const card=buildCard(id,sub);
    S.cards.set(id,card);
    loadModel(id,sub,card);
  });
  renderPicker();renderDeck();paintVotes();syncURL();
  $("#stage").scrollTo({top:0,behavior:"smooth"});
}
async function goDate(date,preferRun,keepModel){
  S.date=date;$("#date-in").value=date;
  $("#run-list").innerHTML='<div class="skel" style="height:58px;border-radius:14px"></div><div class="skel" style="height:58px;border-radius:14px"></div>';
  S.runs=await findRuns(date);
  if(!S.runs.length){
    S.run=null;S.models=[];S.cards.clear();
    renderRunList();renderPrompt();renderPicker();renderDeck();
    return;
  }
  const target=S.runs.find(r=>r.id===preferRun)||S.runs[0];
  renderRunList();selectRun(target,keepModel);
}

$("#view-seg").onclick=e=>{const b=e.target.closest("button");if(b)setView(b.dataset.view);};
$("#date-in").onchange=e=>goDate(e.target.value);
$("#prev-day").onclick=()=>goDate(shiftDate(S.date,-1));
$("#next-day").onclick=()=>goDate(shiftDate(S.date,1));
$("#today").onclick=()=>goDate(todayStr());
$("#latest").onclick=async e=>{
  e.currentTarget.disabled=true;
  let d=todayStr();
  if(!(await probe(d,"01"))){const f=await hunt(d,-1,45);if(f)d=f;else toast("No runs found in the last 45 days");}
  e.currentTarget.disabled=false;goDate(d);
};
$("#random").onclick=async e=>{
  e.currentTarget.disabled=true;
  if(S.manifest&&S.manifest.runs&&S.manifest.runs.length){
    const r=S.manifest.runs[Math.floor(Math.random()*S.manifest.runs.length)];
    await goDate(r.date,String(r.id));
  }else if(S.runs.length>1){
    const others=S.runs.filter(r=>!S.run||r.id!==S.run.id);
    selectRun(others[Math.floor(Math.random()*others.length)]);
  }else{
    let hit=null;
    for(let i=0;i<10&&!hit;i++){
      const back=Math.floor(Math.random()*40)+1;
      const d=shiftDate(todayStr(),-back);
      if(await probe(d,"01"))hit=d;
    }
    if(hit)await goDate(hit);else toast("Couldn't roll a run — try Latest");
  }
  e.currentTarget.disabled=false;
  toast("Rolled a run ✦");
};
$("#sort").onchange=e=>{S.sort=e.target.value;renderPicker();renderDeck();};
$("#filter").oninput=e=>{S.query=e.target.value.trim();renderPicker();if(S.view==="all")renderDeck();};
$("#blind").onclick=e=>{
  S.blind=!S.blind;
  e.currentTarget.textContent="Blind: "+(S.blind?"on":"off");
  e.currentTarget.classList.toggle("on",S.blind);
  paintNames();renderDeck();
  toast(S.blind?"Names hidden — judge fairly":"Names revealed");
};
$("#tall").onclick=e=>{
  S.tall=!S.tall;
  e.currentTarget.textContent=S.tall?"Lock height":"Unlock height";
  e.currentTarget.classList.toggle("on",S.tall);
  renderDeck();
};
$("#reload").onclick=()=>{if(S.run)selectRun(S.run,true);toast("Reloaded run");};
$("#drawer").onclick=()=>$("#rail").classList.toggle("open");
$("#export").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S.judge,null,2)],{type:"application/json"}));
  a.download="starfall-judgments.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),15000);
  toast("Exported judgments");
};
$("#clear-votes").onclick=()=>{S.judge={};saveJudge();paintVotes();renderBoard();renderRunList();toast("Scores cleared");};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeModal();return;}
  const t=e.target.tagName;
  if(t==="INPUT"||t==="SELECT"||t==="TEXTAREA")return;
  if(e.key==="ArrowRight"){e.preventDefault();step(1);}
  else if(e.key==="ArrowLeft"){e.preventDefault();step(-1);}
  else if(e.key==="v"){setView(S.view==="focus"?"compare":S.view==="compare"?"all":"focus");}
  else if(e.key==="b"){$("#blind").click();}
  else if(e.key==="r"){$("#reload").click();}
  else if(e.key==="f"){
    const card=S.cards.get(S.focus);
    const btn=card&&[...card.querySelectorAll(".ib")].find(x=>x.textContent==="⛶");
    if(btn)btn.click();else toast("No preview in this answer");
  }
  else if(/^[1-9]$/.test(e.key)){
    const list=sortedModels().filter(matches);
    const m=list[+e.key-1];
    if(m)pick(m);
  }
});

(async function boot(){
  loadJudge();renderBoard();
  S.manifest=await loadManifest();
  const q=new URLSearchParams(location.search);
  let v="focus";
  try{v=q.get("view")||localStorage.getItem("starfall-view")||"focus"}catch(e){}
  S.view=["focus","compare","all"].includes(v)?v:"focus";
  [...$("#view-seg").children].forEach(b=>b.classList.toggle("on",b.dataset.view===S.view));
  let date=q.get("date");
  if(!date){
    if(S.manifest&&S.manifest.runs&&S.manifest.runs.length){
      date=S.manifest.runs.map(r=>r.date).sort().pop();
    }else{
      date=todayStr();
      if(!(await probe(date,"01"))){
        const f=await hunt(date,-1,45);
        if(f)date=f;else date="2026-08-17";
      }
    }
  }
  await goDate(date,q.get("run")||undefined);
  const m=q.get("model");
  if(m&&S.models.includes(m)){S.focus=m;renderPicker();renderDeck();}
})();
</script>
</body>
