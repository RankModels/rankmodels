<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RankModels Interactive Arena</title>
  <script src="[https://cdn.jsdelivr.net/npm/marked/marked.min.js](https://cdn.jsdelivr.net/npm/marked/marked.min.js)"></script>
  <style>
    body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
    .arena { display: flex; gap: 20px; }
    .card { flex: 1; background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid #30363d; }
    
    .preview-box { margin-top: 15px; border-top: 1px solid #30363d; padding-top: 10px; }
    iframe { width: 100%; height: 420px; border: none; border-radius: 6px; background: #fff; }
  </style>
</head>
<body>
  <h1>🌟 RankModels Live Arena</h1>
  
  <div class="arena">
    <div class="card" id="model-1">Loading...</div>
    <div class="card" id="model-2">Loading...</div>
  </div>

  <script>
    async function loadModelOutput(filePath, elementId) {
      const res = await fetch(filePath);
      const mdText = await res.text();
      
      const card = document.getElementById(elementId);
      
      card.innerHTML = marked.parse(mdText);

      const htmlMatch = mdText.match(/```html\n([\s\S]*?)\n```/i);
      
      if (htmlMatch && htmlMatch[1]) {
        const rawHtmlCode = htmlMatch[1];
        
        const previewDiv = document.createElement('div');
        previewDiv.className = 'preview-box';
        previewDiv.innerHTML = `
          <h3>🎮 Live Interactive Demo</h3>
          <iframe sandbox="allow-scripts allow-modals" srcdoc="${escapeHtmlAttr(rawHtmlCode)}"></iframe>
        `;
        card.appendChild(previewDiv);
      }
    }

    function escapeHtmlAttr(str) {
      return str.replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
    }

    loadModelOutput('./prompts/2026-08/17/01/claude/claude-opus-5/response.md', 'model-1');
    loadModelOutput('./prompts/2026-08/17/01/openai/gpt-5.6-sol/response.md', 'model-2');
  </script>
</body>
</html>
