<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RankModels Interactive Arena</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
    .prompt-box { background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 20px; }
    .arena { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 10px; }
    .card { flex: 1; min-width: 320px; background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid #30363d; }
    .preview-box { margin-top: 15px; border-top: 1px solid #30363d; padding-top: 10px; }
    iframe { width: 100%; height: 420px; border: none; border-radius: 6px; background: #fff; }
  </style>
</head>
<body>
  <h1>🌟 RankModels Live Arena</h1>
  
  <div class="prompt-box" id="prompt-container">Loading prompt info...</div>
  <div class="arena" id="arena-container"></div>

  <script>
    const modelPaths = {
      "claude-opus-5": "claude/claude-opus-5",
      "claude-opus-4.8": "claude/claude-opus-4.8",
      "gpt-5.6-sol": "openai/gpt-5.6-sol",
      "gemini-3.7-flash": "gemini/gemini-3.7-flash",
      "grok-4.6": "grok/grok-4.6"
    };

    async function initArena(runPath) {
      const jsonRes = await fetch(`${runPath}/prompt.json`);
      const promptData = await jsonRes.json();
      
      document.getElementById('prompt-container').innerHTML = `
        <h2>${promptData.title} <small>(${promptData.difficulty})</small></h2>
        <p><strong>Submitted by:</strong> ${promptData.submitted_by}</p>
        <blockquote style="border-left: 3px solid #58a6ff; padding-left: 10px; color: #8b949e;">${promptData.prompt}</blockquote>
      `;

      const arena = document.getElementById('arena-container');
      arena.innerHTML = '';

      for (const modelId of promptData.models_tested) {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${modelId}`;
        card.innerHTML = `<h3>${modelId}</h3><p>Loading output...</p>`;
        arena.appendChild(card);

        const subPath = modelPaths[modelId] || modelId;
        loadModelOutput(`${runPath}/${subPath}/response.md`, card);
      }
    }

    async function loadModelOutput(filePath, cardElement) {
      try {
        const res = await fetch(filePath);
        if (!res.ok) throw new Error("File pending");
        const mdText = await res.text();
        
        cardElement.innerHTML = marked.parse(mdText);

        const htmlMatch = mdText.match(/```html\n([\s\S]*?)\n```/i);
        if (htmlMatch && htmlMatch[1]) {
          const previewDiv = document.createElement('div');
          previewDiv.className = 'preview-box';
          previewDiv.innerHTML = `
            <h3>🎮 Live Interactive Demo</h3>
            <iframe sandbox="allow-scripts allow-modals" srcdoc="${escapeHtmlAttr(htmlMatch[1])}"></iframe>
          `;
          cardElement.appendChild(previewDiv);
        }
      } catch (err) {
        cardElement.innerHTML += `<p style="color: #8b949e;"><em>Output pending or unavailable.</em></p>`;
      }
    }

    function escapeHtmlAttr(str) {
      return str.replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
    }

    initArena('./prompts/2026-08/17/01');
  </script>
</body>
</html>
