name: Process Prompt Submission

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create-prompt-entry:
    if: contains(github.event.issue.labels.*.name, 'prompt-submission')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse Issue Form
        id: parse
        uses: onmax/issue-form-parser@v1.6.0
        with:
          issue_number: ${{ github.event.issue.number }}

      - name: Generate Folder & Files
        run: |
          DATE_PATH="prompts/$(date +'%Y-%m/%d')"
          mkdir -p "$DATE_PATH"
          
          COUNT=$(find "$DATE_PATH" -mindepth 1 -maxdepth 1 -type d | wc -l)
          RUN_ID=$(printf "\%02d" $((COUNT + 1)))
          FULL_PATH="$DATE_PATH/$RUN_ID"

          MODELS=(
            "claude/claude-opus-5"
            "openai/gpt-5.6-sol"
            "gemini/gemini-3.7-flash"
            "grok/grok-4.6"
          )

          for MODEL_PATH in "${MODELS[@]}"; do
            mkdir -p "$FULL_PATH/$MODEL_PATH"
            echo -e "# Response\n\n*Pending output submission...*" > "$FULL_PATH/$MODEL_PATH/response.md"
          done

          python3 -c "
          import json, os
          data = {
              'id': '$RUN_ID',
              'issue_number': ${{ github.event.issue.number }},
              'submitted_by': '@${{ github.event.issue.user.login }}',
              'prompt': '''${{ github.event.issue.body }}''',
              'models_tested': [m.split('/')[1] for m in '''${MODELS[*]}'''.split()]
          }
          os.makedirs('$FULL_PATH', exist_ok=True)
          with open('$FULL_PATH/prompt.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prompts/
          git commit -m "Add benchmark folder for Issue #${{ github.event.issue.number }}"
          git push

      - name: Comment on Issue
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ Benchmark directory created!
            📁 Location: `${{ env.FULL_PATH }}`
